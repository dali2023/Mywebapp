<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Pause Réseaux">
  <title>Pause Réseaux</title>
  <!-- Fond : carré aux coins arrondis, couleur principale -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="#0F766E"/>
  <!-- Cercle de « temps » : anneau clair -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="#FFFFFF" stroke-width="8" opacity="0.35"/>
  <!-- Arc de progression : 70 % de l'anneau -->
  <path d="M64 20 A44 44 0 1 1 22.6 80.5" fill="none" stroke="#5EEAD4" stroke-width="8" stroke-linecap="round"/>
  <!-- Symbole pause : deux barres blanches -->
  <rect x="50" y="46" width="9" height="36" rx="3" fill="#FFFFFF"/>
  <rect x="69" y="46" width="9" height="36" rx="3" fill="#FFFFFF"/>
</svg>
