<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Pause Réseaux</title>
  <style>
    :root { --teal: #0F766E; --ink: #1F2937; --muted: #6B7280; --bg: #F8FAFA; }
    body { width: 280px; margin: 0; font-family: system-ui, sans-serif; color: var(--ink); background: var(--bg); }
    header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: var(--teal); color: #fff; }
    header h1 { font-size: 16px; margin: 0; font-weight: 600; }
    main { padding: 12px 16px 16px; }
    .total { font-size: 28px; font-weight: 700; color: var(--teal); }
    .label { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
    .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #E5E7EB; font-size: 14px; }
    .row:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <header>
    <img src="icons/logo.svg" width="28" height="28" alt="">
    <h1>Pause Réseaux</h1>
  </header>
  <main>
    <div class="label">Temps aujourd'hui</div>
    <div class="total" id="total">0 min</div>
    <div id="sites"></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
