<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Pause Réseaux</title>
  <style>
    :root { --teal: #0F766E; --ink: #1F2937; --muted: #6B7280; --bg: #F8FAFA; }
    body { width: 290px; margin: 0; font-family: system-ui, sans-serif; color: var(--ink); background: var(--bg); }
    header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: var(--teal); color: #fff; }
    header h1 { font-size: 16px; margin: 0; font-weight: 600; flex: 1; }
    .badge { font-size: 11px; background: #5EEAD4; color: #134E4A; padding: 2px 8px; border-radius: 999px; }
    main { padding: 12px 16px 8px; }
    .total { font-size: 28px; font-weight: 700; color: var(--teal); }
    .label { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid #E5E7EB; font-size: 14px; }
    .row:last-child { border-bottom: none; }
    .limit { color: var(--muted); font-size: 12px; }
    footer { display: flex; justify-content: space-between; padding: 10px 16px 14px; font-size: 13px; }
    footer a { color: var(--teal); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" width="28" height="28" alt="">
    <h1>Pause Réseaux</h1>
    <span class="badge" id="pro-badge" hidden>Pro</span>
  </header>
  <main>
    <div class="label">Temps aujourd'hui</div>
    <div class="total" id="total">0 min</div>
    <div id="sites"></div>
  </main>
  <footer>
    <a href="report.html" target="_blank">Bilan de la semaine</a>
    <a href="options.html" target="_blank">Réglages</a>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
